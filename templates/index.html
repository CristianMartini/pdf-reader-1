<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Engine — Evolux Academy</title>
<style>
:root{--navy:#011641;--gold:#e2a331;--bg:#f4f6fb;--card:#fff;--text:#1a2340;--muted:#6b7a99;--border:#dde3f0;--green:#22c55e;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--navy);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.18);}
.brand{color:var(--gold);font-size:1.1rem;font-weight:700;letter-spacing:.5px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Layout */
.app{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 60px);}
@media(max-width:900px){.app{grid-template-columns:1fr;}}

/* Sidebar projetos */
.sidebar{background:#fff;border-right:1px solid var(--border);padding:1.2rem;display:flex;flex-direction:column;gap:1rem;height:calc(100vh - 60px);position:sticky;top:60px;}
@media(max-width:900px){
  .sidebar{height:auto;position:static;border-right:none;border-bottom:1px solid var(--border);}
}
.sidebar h3{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.project-item{padding:10px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center;min-width:0;}
.project-item:hover{border-color:var(--gold);}
.project-item.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.project-item.active .proj-meta{color:#afc6ff;}
.proj-info{flex:1;min-width:0;margin-right:8px;}
.proj-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proj-meta{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proj-del{background:none;border:none;cursor:pointer;color:inherit;opacity:.5;padding:2px 6px;border-radius:4px;flex-shrink:0;}
.proj-del:hover{opacity:1;color:var(--red);}

/* Main */
.main{padding:1.5rem;display:grid;grid-template-columns:1fr 1.4fr;gap:1.2rem;align-content:start;}
@media(max-width:1100px){.main{grid-template-columns:1fr;}}
.full{grid-column:1/-1;}

/* Card */
.card{background:#fff;border-radius:14px;padding:1.3rem;box-shadow:0 2px 16px rgba(1,22,65,.07);border:1px solid var(--border);}
.card-title{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center;gap:8px;}

/* Files */
.file-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.file-item,.img-item,.pdf-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#fafbff;transition:border-color .15s;font-size:.85rem;}
.file-item:hover,.img-item:hover,.pdf-item:hover{border-color:var(--gold);}
.file-item.active{border-color:var(--navy);background:#eef3ff;}
.f-name{flex:1;font-weight:500;word-break:break-all;}
.pdf-item{background:linear-gradient(135deg,#f9fbff,#eef3ff);border-left:3px solid var(--gold);}

/* Editor */
.toolbar{display:flex;gap:6px;flex-wrap:wrap;background:#f8fafc;padding:7px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;}
textarea{width:100%;min-height:380px;padding:12px;border:1px solid var(--border);border-radius:8px;font-family:"Courier New",monospace;font-size:13px;resize:vertical;line-height:1.6;}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;}

/* Btns */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:8px;font-size:.83rem;font-weight:600;border:none;cursor:pointer;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--navy);color:#fff;}.btn-primary:hover{background:#02245e;}
.btn-gold{background:var(--gold);color:var(--navy);}.btn-gold:hover{background:#d09428;}
.btn-sm{padding:4px 10px;font-size:.78rem;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--navy);color:var(--navy);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}.btn-danger:hover{background:var(--red);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Log */
.log{background:var(--navy);border-radius:8px;padding:.8rem;font-family:monospace;font-size:.78rem;color:#afc6ff;max-height:160px;overflow-y:auto;white-space:pre-wrap;display:none;margin-top:.8rem;}
.log.on{display:block;}.log .ok{color:var(--green);}.log .err{color:var(--red);}

/* Toast */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--navy);color:#fff;padding:.7rem 1.2rem;border-radius:10px;transform:translateY(100px);opacity:0;transition:all .3s;z-index:999;font-size:.88rem;}
#toast.show{transform:translateY(0);opacity:1;}
#toast.success{border-left:4px solid var(--green);}
#toast.error{border-left:4px solid var(--red);}

/* Empty state */
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);}
.empty h2{margin-bottom:.5rem;color:var(--navy);}
.muted{color:var(--muted);font-size:.82rem;}

/* New project input */
.new-proj{display:flex;gap:6px;}
.new-proj input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;}

.spinning{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Estilos de Item de Imagem */
.img-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  transition: border-color 0.2s, box-shadow 0.2s;
  cursor: pointer;
}
.img-item:hover {
  border-color: var(--navy);
  box-shadow: 0 2px 6px rgba(1, 22, 65, 0.08);
}
.img-item .img-icon {
  width: 36px; height: 36px; border-radius: 6px;
  border: 1px solid var(--border); background: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 1.2rem;
}
/* Preview flutuante global — position:fixed nunca é cortado por overflow */
#imgFloatPreview {
  position: fixed;
  width: 260px;
  max-height: 260px;
  background: #fff;
  border: 2px solid var(--navy);
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(1, 22, 65, 0.22);
  z-index: 9999;
  pointer-events: none;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.15s ease-out;
  display: flex;
  flex-direction: column;
}
#imgFloatPreview.visible { opacity: 1; }
#imgFloatPreview img {
  width: 100%; max-height: 220px;
  object-fit: contain;
  background: #f1f5f9;
  border-radius: 8px 8px 0 0;
}
#imgFloatPreview .preview-label {
  padding: 4px 8px; font-size: .72rem;
  color: var(--navy); text-align: center;
  background: #f8fafc; border-top: 1px solid var(--border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
</style>
</head>
<body>

<header>
  <span class="brand">⚡ PDF Engine • Evolux Academy</span>
  <div style="display:flex;align-items:center;gap:16px;">
    <a href="/api/instrucoes-ia" class="btn btn-ghost btn-sm" style="color:#afc6ff; border-color:rgba(175,198,255,0.3); font-weight:normal;" title="Baixe o manual de formatação para alimentar IAs">🤖 Instruções IA</a>
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="dot"></div>
      <span style="color:#afc6ff;font-size:.8rem;">live</span>
    </div>
  </div>
</header>

<div class="app">

  <!-- ══ SIDEBAR PROJETOS ══ -->
  <aside class="sidebar">
    <div>
      <h3 style="margin-bottom:.6rem;">📁 Projetos</h3>
      <div class="new-proj">
        <input id="newProjName" placeholder="Nome do projeto..." onkeydown="if(event.key==='Enter')createProject()">
        <button class="btn btn-gold btn-sm" onclick="createProject()">＋</button>
      </div>
    </div>
    <div id="projectList" style="display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;"></div>
  </aside>

  <!-- ══ MAIN ══ -->
  <div class="main" id="mainArea">
    <div class="empty full">
      <h2>Selecione ou crie um projeto</h2>
      <p>Cada projeto tem seus próprios documentos, imagens e PDFs.</p>
    </div>
  </div>

</div>

<div id="toast"></div>

<!-- Preview flutuante de imagem (position:fixed, fora de qualquer container) -->
<div id="imgFloatPreview">
  <img src="" alt="Preview">
  <div class="preview-label"></div>
</div>

<script>
let proj = null;   // projeto ativo
let file = null;   // arquivo ativo
let _mdSig = "", _pdfSig = "", _imgSig = "";
let _toastT = null;
let uploadQueue = []; // Fila de uploads para IA
let isProcessingQueue = false;
let shouldStopProcessing = false;

function stopQueueProcessing() {
  shouldStopProcessing = true;
  const btnStop = document.getElementById("btnStopQueue");
  if (btnStop) {
    btnStop.disabled = true;
    btnStop.innerHTML = '<span class="spinning">⏳</span> Parando...';
  }
  toast("🛑 Interrompendo processamento...", "warning");
}

// ══ PROJETOS ══
async function loadProjects() {
  const r = await fetch("/api/projects");
  const d = await r.json();
  const el = document.getElementById("projectList");
  el.innerHTML = d.projects.map(p => `
    <div class="project-item ${p.name===proj?'active':''}" onclick="selectProject('${p.name}')">
      <div class="proj-info">
        <div class="proj-name">📂 ${p.name}</div>
        <div class="proj-meta">${p.mds} doc${p.mds!==1?'s':''} • ${p.pdfs} PDF${p.pdfs!==1?'s':''}</div>
      </div>
      <button class="proj-del" onclick="event.stopPropagation();deleteProject('${p.name}')" title="Excluir projeto">🗑</button>
    </div>
  `).join("") || '<p class="muted">Nenhum projeto ainda.</p>';
}

async function createProject() {
  const inp = document.getElementById("newProjName");
  const name = inp.value.trim();
  if (!name) return;
  const r = await fetch("/api/projects", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name})
  });
  const d = await r.json();
  if (d.ok) { inp.value=""; await loadProjects(); selectProject(d.name); }
  else toast("❌ " + d.error, "error");
}

async function deleteProject(name) {
  if (!confirm(`Excluir projeto "${name}" e todos os seus arquivos?`)) return;
  await fetch(`/api/projects/${encodeURIComponent(name)}`, {method:"DELETE"});
  if (proj === name) { proj=null; file=null; renderEmpty(); }
  loadProjects();
  toast("🗑 Projeto removido");
}

function renderEmpty() {
  document.getElementById("mainArea").innerHTML = `
    <div class="empty full"><h2>Selecione ou crie um projeto</h2>
    <p>Cada projeto tem seus próprios documentos, imagens e PDFs.</p></div>`;
}

// ══ SELECIONAR PROJETO ══
function selectProject(name) {
  proj = name; file = null; _mdSig = ""; _pdfSig = ""; _imgSig = "";
  uploadQueue = []; // Limpa fila ao trocar de projeto
  isProcessingQueue = false;
  loadProjects();
  renderMain();
}

function renderMain() {
  document.getElementById("mainArea").innerHTML = `
    <!-- COLUNA DA ESQUERDA: FLUXO DE ARQUIVOS (PASSO 1, 2 E 3) -->
    <div style="display: flex; flex-direction: column; gap: 1.2rem;">
      
      <!-- CARD PASSO 1: IMPORTADOR EM LOTE COM IA -->
      <div class="card" style="position: relative; overflow: hidden; background: linear-gradient(145deg, #ffffff, #fbfcfe); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);">
        <!-- Linha dourada/azul sutil no topo do card -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--navy), var(--gold));"></div>
        
        <div class="card-title" style="margin-bottom: 0.5rem;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700; box-shadow: 0 2px 4px rgba(1, 22, 65, 0.15);">Passo 1</span>
            <span style="font-weight: 700; color: var(--navy);">🤖 Importar Aulas (Lote/IA)</span>
          </div>
        </div>
        
        <p class="muted" style="margin-bottom: 1rem; line-height: 1.5; font-size: 0.82rem;">
          Selecione múltiplos arquivos <b>.pdf</b> ou <b>.md</b> antigos. A IA extrairá o texto de forma otimizada (sem custo visual de tokens) e estruturará no estilo premium Evolux.
        </p>
        
        <!-- Dropzone Premium -->
        <div style="border: 2px dashed rgba(208, 148, 40, 0.4); padding: 1.8rem 1.2rem; text-align: center; border-radius: 12px; cursor: pointer; transition: all 0.25s ease; background: rgba(249, 251, 255, 0.5); position: relative; overflow: hidden;" 
             id="dropZone"
             onclick="document.getElementById('queueUp').click()"
             onmouseover="this.style.borderColor='var(--gold)'; this.style.background='rgba(249, 251, 255, 0.85)'; this.style.boxShadow='0 4px 12px rgba(208, 148, 40, 0.08)';"
             onmouseout="this.style.borderColor='rgba(208, 148, 40, 0.4)'; this.style.background='rgba(249, 251, 255, 0.5)'; this.style.boxShadow='none';">
          <div style="font-size: 2rem; display: block; margin-bottom: 6px; filter: drop-shadow(0 3px 6px rgba(1, 22, 65, 0.1));">📤</div>
          <span style="font-size: .88rem; font-weight: 700; color: var(--navy); display: block; margin-bottom: 2px;">Selecionar arquivos .pdf ou .md</span>
          <span style="font-size: .74rem; color: var(--muted);">Arraste-os para cá ou clique para explorar</span>
          <input type="file" id="queueUp" accept=".md,.pdf" multiple style="display:none" onchange="addFilesToQueue(this)">
        </div>
        
        <!-- Seção da Fila de Processamento -->
        <div id="queueSection" style="display:none; margin-top: 1.2rem; border-top: 1px solid var(--border); padding-top: 1rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.8rem; gap: 8px; flex-wrap: wrap;">
            <div style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="queueCheckAll" checked style="cursor:pointer; width:16px; height:16px; accent-color: var(--navy);" onchange="toggleSelectAllQueue(this.checked)">
              <span style="font-size:.82rem; font-weight:700; color:var(--navy);">Fila (<span id="queueCount">0</span>)</span>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-gold btn-sm" id="btnProcessQueue" onclick="processQueue()" style="box-shadow: 0 2px 4px rgba(208,148,40,0.15);">▶ Processar Selecionados</button>
              <button class="btn btn-danger btn-sm" id="btnStopQueue" style="display:none; box-shadow: 0 2px 4px rgba(239,68,68,0.2); font-weight: bold; background-color: #ef4444; color: white;" onclick="stopQueueProcessing()">🛑 Parar</button>
            </div>
          </div>
          <div class="file-list" id="queueList" style="max-height: 220px; border: 1px solid var(--border); border-radius: 8px; background: #fafbfc; padding: 4px; overflow-y: auto;"></div>
        </div>
      </div>

      <!-- CARD PASSO 2: DOCUMENTOS -->
      <div class="card">
        <div class="card-title" style="justify-content: space-between; align-items: center; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700;">Passo 2</span>
            <span>📄 Selecionar Documento</span>
          </div>
          <div style="display: flex; gap: 6px; align-items: center;">
            <button class="btn btn-gold btn-sm" onclick="downloadAllMds()" title="Baixar todos os arquivos Markdown do projeto em um ZIP (para Chatbots)">📦 Baixar ZIP</button>
            <button class="btn btn-primary btn-sm" onclick="document.getElementById('mdUp').click()">＋ Upload .md</button>
            <input type="file" id="mdUp" accept=".md" style="display:none" onchange="uploadFile(this,'md')">
          </div>
        </div>
        <p class="muted" style="margin-bottom:.6rem;">Selecione um arquivo Markdown abaixo para carregar no editor.</p>
        <div class="file-list" id="mdList" style="max-height: 180px;"></div>
      </div>

      <!-- CARD PASSO 3: IMAGENS -->
      <div class="card">
        <div class="card-title" style="justify-content: space-between; align-items: center; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700;">Passo 3</span>
            <span>🖼️ Inserir Imagens</span>
          </div>
          <div>
            <button class="btn btn-gold btn-sm" onclick="document.getElementById('imgUp').click()">＋ Upload</button>
            <button class="btn btn-danger btn-sm" onclick="clearImages()" style="margin-left:4px;">🗑 Limpar</button>
            <input type="file" id="imgUp" accept="image/*" multiple style="display:none" onchange="uploadFile(this,'img')">
          </div>
        </div>
        <p class="muted" style="margin-bottom:.6rem;">Clique para inserir no cursor do editor ou selecione caixas para agrupar.</p>
        <div class="file-list" id="imgList" style="max-height: 180px;"></div>
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
          <button class="btn btn-gold btn-sm" onclick="insertSelectedImages()" style="width: 100%; justify-content: center;">▶ Inserir Selecionadas Juntas</button>
        </div>
      </div>

    </div>

    <!-- COLUNA DA DIREITA: EDITOR E CRIAÇÃO (PASSO 4) -->
    <div class="card" style="display: flex; flex-direction: column; gap: 0.8rem; height: 100%;">
      <div class="card-title" style="justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 0;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700;">Passo 4</span>
          <span>✍️ Editor de Conteúdo</span>
        </div>
        <span id="fileName" style="font-size:.82rem;color:var(--muted);font-weight:normal;">Nenhum arquivo</span>
      </div>
      
      <div class="toolbar">
        <button class="btn btn-ghost btn-sm" onclick="ins('# ')">H1</button>
        <button class="btn btn-ghost btn-sm" onclick="ins('## ')">H2</button>
        <button class="btn btn-ghost btn-sm" onclick="ins('### ')">H3</button>
        <button class="btn btn-ghost btn-sm" onclick="ins('- ')">Lista</button>
        <button class="btn btn-ghost btn-sm" onclick="insBox()">Box</button>
        <button class="btn btn-ghost btn-sm" onclick="insImg('nome.jpg')">1 Imagem</button>
        <button class="btn btn-ghost btn-sm" onclick="insImg('img1.jpg|img2.jpg')">2 Imagens</button>
        <button class="btn btn-ghost btn-sm" onclick="insDivider()">Divisor</button>
      </div>
      
      <textarea id="ed" style="flex: 1; min-height: 520px;" placeholder="Selecione um arquivo ou comece a escrever...&#10;&#10;Use front-matter:&#10;---&#10;title: Título da Aula&#10;aula: 01&#10;---"></textarea>
      
      <div class="actions">
        <button class="btn btn-primary" onclick="saveFile()">💾 Salvar</button>
        <button class="btn btn-gold" id="btnGen" onclick="generatePDF()">▶ Gerar PDF</button>
        <button class="btn btn-danger" id="btnDel" onclick="deleteCurrentFile()" style="display:none;margin-left:auto;">🗑 Excluir</button>
      </div>
      
      <div class="log" id="log"></div>
    </div>

    <!-- SEÇÃO INFERIOR: PDFs GERADOS (PASSO 5) -->
    <div class="card full">
      <div class="card-title" style="justify-content: space-between; align-items: center; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700;">Passo 5</span>
          <span>📑 PDFs Gerados (Padrão Evolux)</span>
          <span id="pdfCount" style="font-size:.8rem;color:var(--muted);font-weight:normal; margin-left: 6px;"></span>
        </div>
        <button class="btn btn-gold btn-sm" onclick="downloadAllPdfs()" title="Baixar todos os PDFs gerados em um arquivo ZIP">📦 Baixar Todos PDFs</button>
      </div>
      <div id="pdfList" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
    </div>
  `;
  loadFiles();
}

// ══ ARQUIVOS ══
async function loadFiles(force=false) {
  if (!proj) return;
  const url = `/api/files/${encodeURIComponent(proj)}` + (force ? "?force=true" : "");
  const r = await fetch(url);
  const d = await r.json();

  const mdSig = JSON.stringify(d.mds);
  if (mdSig !== _mdSig) {
    _mdSig = mdSig;
    document.getElementById("mdList").innerHTML = d.mds.map(f => `
      <div class="file-item ${f===file?'active':''}" style="cursor:pointer" onclick="loadFile('${f}')">
        <span class="f-name">📄 ${f}</span>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();delFile('md','${f}')">🗑</button>
      </div>`).join("") || '<p class="muted">Nenhum documento</p>';
  }

  const imgSig = JSON.stringify(d.imgs);
  if (imgSig !== _imgSig) {
    _imgSig = imgSig;
    document.getElementById("imgList").innerHTML = d.imgs.map(f => {
      const safeF = f.replace(/'/g, "\\'").replace(/"/g, "&quot;");
      return `
        <div class="img-item"
             data-img-url="/projects/${encodeURIComponent(proj)}/assets/${encodeURIComponent(f)}"
             data-img-name="${f}"
             onmouseenter="showImgPreview(event, this)"
             onmousemove="moveImgPreview(event)"
             onmouseleave="hideImgPreview()">
          <input type="checkbox" class="img-check" value="${f}" style="cursor:pointer; width:16px; height:16px; flex-shrink:0;" onclick="event.stopPropagation()">
          <div class="img-icon" onclick="insImg('${safeF}')">🖼️</div>
          <span class="f-name" style="cursor:pointer; flex:1; word-break:break-all; font-size:.82rem; font-weight:500;" onclick="insImg('${safeF}')" title="Inserir no editor">${f}</span>
          <button class="btn btn-ghost btn-sm" style="flex-shrink:0; padding:2px 6px;" onclick="event.stopPropagation(); delFile('img','${safeF}')">🗑</button>
        </div>
      `;
    }).join("") || '<p class="muted">Nenhuma imagem</p>';
  }

  const pdfSig = JSON.stringify(d.pdfs);
  if (pdfSig !== _pdfSig) {
    _pdfSig = pdfSig;
    document.getElementById("pdfList").innerHTML = d.pdfs.map(f => `
      <div class="pdf-item" style="width:min(100%,360px)">
        <span class="f-name">📑 ${f}</span>
        <a href="/projects/${encodeURIComponent(proj)}/pdf/${encodeURIComponent(f)}" target="_blank" class="btn btn-primary btn-sm">Abrir</a>
        <a href="/projects/${encodeURIComponent(proj)}/pdf/${encodeURIComponent(f)}" download class="btn btn-gold btn-sm">Baixar</a>
        <button class="btn btn-danger btn-sm" onclick="delFile('pdf','${f}')">🗑</button>
      </div>`).join("") || '<p class="muted">Nenhum PDF gerado</p>';
    const c = d.pdfs.length;
    const el = document.getElementById("pdfCount");
    if (el) el.textContent = c ? `${c} arquivo${c>1?'s':''}` : "";
  }
}

async function uploadFile(input, kind) {
  if (!input.files.length || !proj) return;
  
  const files = Array.from(input.files);
  let uploadSuccessCount = 0;
  let singleMdLoadedName = null;
  
  toast("Iniciando upload...", "success");
  
  for (let fObj of files) {
    try {
      // 1. Tenta obter Signed URL do backend
      const resSig = await fetch("/api/upload/signed-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project: proj,
          filename: fObj.name,
          contentType: fObj.type || "application/octet-stream",
          kind: kind
        })
      });
      const dataSig = await resSig.json();
      
      if (dataSig.ok && dataSig.firebase_active && dataSig.url) {
        // Firebase active: upload directly to Firebase Storage (bypasses Vercel 4.5MB limit)
        const uploadRes = await fetch(dataSig.url, {
          method: "PUT",
          headers: {
            "Content-Type": fObj.type || "application/octet-stream"
          },
          body: fObj
        });
        
        if (!uploadRes.ok) {
          throw new Error(`Erro HTTP no upload direto: ${uploadRes.statusText}`);
        }
        
        // Confirm upload with backend so it downloads the file to the local container
        const confirmRes = await fetch(`/api/upload/confirm/${encodeURIComponent(proj)}/${kind}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: dataSig.safe_name })
        });
        const dataConfirm = await confirmRes.json();
        
        if (dataConfirm.ok) {
          uploadSuccessCount++;
          if (kind === 'md' && files.length === 1) {
            singleMdLoadedName = dataSig.safe_name;
          }
        } else {
          throw new Error(`Erro na confirmação: ${dataConfirm.error}`);
        }
      } else {
        // Fallback: Firebase inactive or error. Standard upload via Flask
        const isVercel = window.location.hostname.endsWith('.vercel.app');
        if (isVercel && fObj.size > 4.5 * 1024 * 1024) {
          toast(`❌ Arquivo ${fObj.name} excede o limite de 4.5MB da Vercel (sem Firebase).`, "error");
          continue;
        }
        
        const fd = new FormData();
        fd.append("files", fObj);
        const r = await fetch(`/api/upload/${encodeURIComponent(proj)}/${kind}`, {
          method: "POST",
          body: fd
        });
        const d = await r.json();
        
        if (d.ok) {
          uploadSuccessCount += d.saved;
          if (kind === 'md' && files.length === 1) {
            singleMdLoadedName = fObj.name;
          }
        } else {
          throw new Error(d.error || "Erro no upload tradicional");
        }
      }
    } catch (err) {
      console.error(err);
      toast(`❌ Erro no upload de ${fObj.name}: ${err.message}`, "error");
    }
  }
  
  if (uploadSuccessCount > 0) {
    toast(`✅ ${uploadSuccessCount} arquivo(s) enviado(s)`, "success");
    _mdSig = _imgSig = ""; 
    await loadFiles(true); 
    loadProjects();
    if (kind === 'md' && files.length === 1 && singleMdLoadedName) {
      loadFile(singleMdLoadedName);
    }
  }
  input.value = "";
}

function ins(text) {
  const t = document.getElementById("ed");
  const s = t.selectionStart, e = t.selectionEnd;
  t.value = t.value.substring(0,s) + text + t.value.substring(e);
  t.selectionStart = t.selectionEnd = s + text.length;
  t.focus();
}

function insImg(f) {
  const t = document.getElementById("ed");
  const s = t.selectionStart, e = t.selectionEnd;
  const selText = t.value.substring(s, e);
  
  if (s !== e && /\[IMG:[^\]]+\]/.test(selText)) {
    const newText = selText.replace(/\[IMG:[^\]]+\]/, `[IMG:${f}]`);
    t.value = t.value.substring(0, s) + newText + t.value.substring(e);
    t.selectionStart = s;
    t.selectionEnd = s + newText.length;
    t.focus();
    toast("🖼️ Imagem substituída na tag mantendo a legenda", "success");
  } else {
    ins('\n[IMG:' + f + ']\n');
  }
}

// ══ FILA DE PROCESSAMENTO COM IA ══
async function addFilesToQueue(input) {
  if (!input.files.length || !proj) return;
  
  const files = Array.from(input.files);
  const filesToConfirm = [];
  const filesToTraditionalUpload = [];
  
  toast("Iniciando uploads para a fila...", "success");
  
  for (let fObj of files) {
    try {
      // 1. Tenta obter Signed URL para a fila temporária
      const resSig = await fetch("/api/upload/signed-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project: proj,
          filename: fObj.name,
          contentType: fObj.type || "application/octet-stream",
          kind: "queue"
        })
      });
      const dataSig = await resSig.json();
      
      if (dataSig.ok && dataSig.firebase_active && dataSig.url) {
        // Firebase active: upload directly to Firebase Storage (bypasses Vercel 4.5MB limit)
        const uploadRes = await fetch(dataSig.url, {
          method: "PUT",
          headers: {
            "Content-Type": fObj.type || "application/octet-stream"
          },
          body: fObj
        });
        
        if (!uploadRes.ok) {
          throw new Error(`Erro HTTP no upload direto: ${uploadRes.statusText}`);
        }
        
        const ext = fObj.name.split('.').pop().toLowerCase();
        filesToConfirm.push({
          name: fObj.name,
          safe_name: dataSig.safe_name,
          type: ext
        });
      } else {
        // Fallback: Firebase inactive or error. Add to traditional upload list
        filesToTraditionalUpload.push(fObj);
      }
    } catch (err) {
      console.error(err);
      toast("❌ Erro ao enviar para o Storage: " + err.message, "error");
    }
  }
  
  // 2. Confirm direct uploads with backend
  if (filesToConfirm.length > 0) {
    try {
      toast("Processando arquivos no servidor... Aguarde a extração para listar na fila.", "success");
      const confirmRes = await fetch(`/api/queue/confirm/${encodeURIComponent(proj)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ files: filesToConfirm })
      });
      const dataConfirm = await confirmRes.json();
      
      if (dataConfirm.ok && dataConfirm.files) {
        dataConfirm.files.forEach(f => {
          uploadQueue.push({
            name: f.name,
            safe_name: f.safe_name,
            type: f.type,
            status: "pending",
            error: null,
            saved_as: null,
            checked: true
          });
        });
        toast(`✅ ${dataConfirm.files.length} arquivos na fila`, "success");
        renderQueue();
      } else {
        toast("❌ Erro ao confirmar arquivos no servidor", "error");
      }
    } catch (err) {
      toast("❌ Falha de rede na confirmação da fila", "error");
    }
  }
  
  // 3. Process traditional uploads (if any)
  if (filesToTraditionalUpload.length > 0) {
    const isVercel = window.location.hostname.endsWith('.vercel.app');
    let traditionalAllowed = true;
    
    if (isVercel) {
      let totalSize = 0;
      for (let fObj of filesToTraditionalUpload) totalSize += fObj.size;
      if (totalSize > 4.5 * 1024 * 1024) {
        toast("❌ Limite de 4.5MB excedido nos arquivos restantes (restrição do Vercel).", "error");
        traditionalAllowed = false;
      }
    }
    
    if (traditionalAllowed) {
      const fd = new FormData();
      for (let fObj of filesToTraditionalUpload) fd.append("files", fObj);
      
      try {
        toast("Processando arquivos no servidor... Aguarde a extração para listar na fila.", "success");
        const r = await fetch(`/api/queue/upload/${encodeURIComponent(proj)}`, {
          method: "POST",
          body: fd
        });
        const d = await r.json();
        
        if (d.ok) {
          d.files.forEach(f => {
            uploadQueue.push({
              name: f.name,
              safe_name: f.safe_name,
              type: f.type,
              status: "pending",
              error: null,
              saved_as: null,
              checked: true
            });
          });
          toast(`✅ ${d.files.length} arquivos adicionados à fila`, "success");
          renderQueue();
        } else {
          toast("❌ Erro no upload tradicional: " + d.error, "error");
        }
      } catch (err) {
        toast("❌ Falha de rede no upload tradicional", "error");
      }
    }
  }
  
  input.value = "";
}

function renderQueue() {
  const sec = document.getElementById("queueSection");
  const list = document.getElementById("queueList");
  const count = document.getElementById("queueCount");
  
  if (!sec || !list || !count) return;
  
  if (uploadQueue.length === 0) {
    sec.style.display = "none";
    return;
  }
  
  sec.style.display = "block";
  count.textContent = uploadQueue.length;
  
  list.innerHTML = uploadQueue.map((item, idx) => {
    let statusBadge = "";
    let btnOpen = "";
    let btnReprocess = "";
    let checkbox = "";
    
    if (item.status === "pending" || item.status === "failed") {
      checkbox = `<input type="checkbox" class="queue-check" ${item.checked ? 'checked' : ''} style="cursor:pointer; width:18px; height:18px; accent-color: var(--navy);" onchange="toggleQueueItemChecked(${idx}, this.checked)" ${isProcessingQueue ? 'disabled' : ''}>`;
    } else {
      checkbox = `<div style="width:18px; height:18px;"></div>`;
    }
    
    if (item.status === "pending") {
      statusBadge = `<span style="font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:6px; background:#e2e8f0; color:#475569;">Pendente</span>`;
    } else if (item.status === "processing") {
      statusBadge = `<span style="font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:6px; background:#fef08a; color:#854d0e;"><span class="spinning" style="margin-right:2px;">⏳</span> ${item.status_msg || 'Processando...'}</span>`;
    } else if (item.status === "completed") {
      statusBadge = `<span style="font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:6px; background:#dcfce7; color:#166534;">Pronto</span>`;
      btnOpen = `<button class="btn btn-primary btn-sm" style="padding:2px 8px; font-size:.72rem; border-radius:6px;" onclick="loadFile('${item.saved_as}')">Editar</button>`;
      btnReprocess = `<button class="btn btn-ghost btn-sm" style="padding:2px 6px; border-radius:6px; color:var(--gold); border-color:var(--gold);" onclick="reprocessQueueItem(${idx})" title="Reprocessar arquivo individual" ${isProcessingQueue ? 'disabled' : ''}>🔄</button>`;
    } else if (item.status === "failed") {
      statusBadge = `<span style="font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:6px; background:#fee2e2; color:#991b1b;" title="${item.error || 'Erro desconhecido'}">Falha</span>`;
      btnReprocess = `<button class="btn btn-ghost btn-sm" style="padding:2px 6px; border-radius:6px; color:var(--gold); border-color:var(--gold);" onclick="reprocessQueueItem(${idx})" title="Reprocessar arquivo individual" ${isProcessingQueue ? 'disabled' : ''}>🔄</button>`;
    }
    
    return `
      <div class="file-item" style="justify-content:space-between; gap:10px; align-items:center; padding:8px 12px; margin-bottom:6px; border:1px solid var(--border); border-radius:8px; background:#ffffff; transition:all 0.15s ease;" onmouseover="this.style.boxShadow='0 2px 6px rgba(0,0,0,0.03)';" onmouseout="this.style.boxShadow='none';">
        <div style="display:flex; align-items:center; gap:10px; flex:1;">
          ${checkbox}
          <div style="display:flex; flex-direction:column; gap:2px; flex:1;">
            <span style="font-weight:600; word-break:break-all; font-size:.82rem; color:var(--navy);">${item.type === 'pdf' ? '📑' : '📄'} ${item.name}</span>
            ${item.error ? `<span style="font-size:.72rem; color:var(--red); font-weight:500;">${item.error}</span>` : ""}
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          ${statusBadge}
          ${btnOpen}
          ${btnReprocess}
          <button class="btn btn-ghost btn-sm" style="padding:4px 8px; border-radius:6px;" onclick="removeFromQueue(${idx})" ${isProcessingQueue ? 'disabled' : ''} title="Remover da fila">🗑</button>
        </div>
      </div>
    `;
  }).join("");
}

function toggleQueueItemChecked(idx, checked) {
  uploadQueue[idx].checked = checked;
  if (!checked) {
    const el = document.getElementById("queueCheckAll");
    if (el) el.checked = false;
  }
}

function toggleSelectAllQueue(checked) {
  uploadQueue.forEach(item => {
    if (item.status === "pending" || item.status === "failed") {
      item.checked = checked;
    }
  });
  renderQueue();
}

async function removeFromQueue(idx) {
  if (isProcessingQueue) return;
  const item = uploadQueue[idx];
  if (!confirm(`Remover "${item.name}" da fila?`)) return;
  
  try {
    const res = await fetch(`/api/queue/delete/${encodeURIComponent(proj)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: item.safe_name })
    });
    const data = await res.json();
    if (!data.ok) {
      console.warn("Aviso ao remover no servidor:", data.error);
    }
  } catch (e) {
    console.error("Erro de rede ao remover do servidor:", e);
  }
  
  uploadQueue.splice(idx, 1);
  renderQueue();
  toast(`🗑 Fila: ${item.name} removido`, "success");
}

let geminiConfig = null;

async function loadGeminiConfig() {
  if (geminiConfig) return geminiConfig;
  try {
    const res = await fetch("/api/config/gemini");
    const data = await res.json();
    if (data.ok) {
      geminiConfig = data;
      return geminiConfig;
    }
  } catch (err) {
    console.error("Erro ao carregar configurações do Gemini:", err);
  }
  return null;
}

let currentKeyIdx = 0;

async function callGeminiDirect(prompt, maxRetries = 5, initialBackoff = 2000) {
  const config = await loadGeminiConfig();
  if (!config || (!config.key && (!config.keys || config.keys.length === 0))) {
    throw new Error("Chave do Gemini API não encontrada no backend");
  }
  
  // Lista de chaves disponíveis (se keys estiver vazio ou indisponível, usa config.key)
  const keys = config.keys && config.keys.length > 0 ? config.keys : [config.key];
  const keysCount = keys.length;
  
  const baseModel = config.model || "gemini-2.5-pro";
  let currentModel = baseModel;
  
  let keysTriedForCurrentModel = 0;
  let sleepsCount = 0;
  let backoff = initialBackoff;
  
  while (true) {
    const activeKey = keys[currentKeyIdx % keysCount];
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${activeKey}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });
      
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        const status = res.status;
        const msg = errData.error?.message || res.statusText;
        throw { status, message: msg };
      }
      
      const data = await res.json();
      if (!data.candidates || data.candidates.length === 0) {
        throw new Error("Nenhum resultado gerado pelo modelo.");
      }
      
      return data.candidates[0].content.parts[0].text;
      
    } catch (err) {
      console.warn(`⚠️ Gemini Direct erro na chave ${currentKeyIdx % keysCount + 1} (${currentModel}):`, err);
      
      const errMsg = err.message || "";
      const isQuotaLimit = err.status === 429 || 
                           errMsg.includes("quota") || 
                           errMsg.includes("RESOURCE_EXHAUSTED") || 
                           errMsg.includes("ResourceExhausted") ||
                           errMsg.includes("rate limit");
                           
      const isTemporary = isQuotaLimit || err.status === 503 || err.status === 504 || 
                          errMsg.includes("demand") || errMsg.includes("temporary") || errMsg.includes("overloaded");
      
      if (!isTemporary) {
        // Erro permanente (como chave inválida ou erro de sintaxe)
        // Se tivermos outras chaves, podemos tentar rotacionar a chave e continuar
        if (keysCount > 1 && keysTriedForCurrentModel < keysCount - 1) {
          console.warn("🔄 Rotacionando para próxima chave devido a erro permanente na chave atual...");
          currentKeyIdx = (currentKeyIdx + 1) % keysCount;
          keysTriedForCurrentModel++;
          continue;
        }
        throw new Error(errMsg || "Erro permanente na API do Gemini");
      }
      
      if (isQuotaLimit) {
        keysTriedForCurrentModel++;
        if (keysTriedForCurrentModel >= keysCount) {
          // Já tentou todas as chaves com esse modelo
          if (currentModel === "gemini-2.5-pro") {
            console.warn(`🔄 Cota do PRO excedida em todas as chaves (${keysCount}). Fazendo fallback para gemini-2.5-flash...`);
            currentModel = "gemini-2.5-flash";
            keysTriedForCurrentModel = 0;
            // Tenta imediatamente com o Flash, sem dormir
            continue;
          } else {
            // Já tentou todas as chaves com Flash também
            if (sleepsCount >= maxRetries) {
              throw new Error(errMsg || "Limite de retentativas excedido (cota esgotada em todas as chaves e modelos)");
            }
            const sleepTime = backoff + Math.random() * 1000;
            console.warn(`⏳ Cota esgotada em tudo. Aguardando ${(sleepTime/1000).toFixed(2)}s antes de reiniciar ciclo...`);
            await new Promise(r => setTimeout(r, sleepTime));
            sleepsCount++;
            backoff *= 2;
            keysTriedForCurrentModel = 0;
            currentModel = baseModel; // reinicia com o modelo pro
          }
        } else {
          // Rotaciona chave e tenta imediatamente
          currentKeyIdx = (currentKeyIdx + 1) % keysCount;
          console.warn(`🔄 Cota excedida na chave. Rotacionando para a chave ${currentKeyIdx % keysCount + 1} com ${currentModel}...`);
          continue;
        }
      } else {
        // Outro erro temporário (ex: 503/504)
        if (sleepsCount >= maxRetries) {
          throw new Error(errMsg || "Erro temporário persistente do Gemini");
        }
        // Rotaciona chave e dorme antes de retentar
        currentKeyIdx = (currentKeyIdx + 1) % keysCount;
        const sleepTime = backoff + Math.random() * 1000;
        console.warn(`⏳ Erro temporário do servidor. Aguardando ${(sleepTime/1000).toFixed(2)}s...`);
        await new Promise(r => setTimeout(r, sleepTime));
        sleepsCount++;
        backoff *= 2;
        keysTriedForCurrentModel = 0;
      }
    }
  }
}

function sanitizeMarkdown(txt) {
  if (!txt) return "";
  let clean = txt.trim();
  
  // 1. Remove tags de bloco markdown envolventes (ex: ```markdown ... ```)
  clean = clean.replace(/^```markdown\s*/i, "");
  clean = clean.replace(/^```\s*/, "");
  clean = clean.replace(/\s*```$/, "");
  clean = clean.trim();
  
  // 2. Remove qualquer preâmbulo/comentário de introdução antes do cabeçalho YAML
  const yamlStartIndex = clean.indexOf("---");
  if (yamlStartIndex !== -1 && yamlStartIndex > 0) {
    // Verifica se o texto anterior contém algo além de espaços
    const beforeYaml = clean.substring(0, yamlStartIndex).trim();
    if (beforeYaml.length > 0) {
      console.log("✂️ Sanitizador: Removendo preâmbulo encontrado antes do cabeçalho YAML:", beforeYaml);
      clean = clean.substring(yamlStartIndex).trim();
    }
  }

  // 3. Remove caracteres de blockquote (>) do início de linhas
  clean = clean.split('\n').map(line => {
    const trimmed = line.trim();
    if (trimmed.startsWith('>')) {
      return line.replace(/^(\s*>)+/, "").trimStart();
    }
    return line;
  }).join('\n');
  
  return clean;
}

async function processQueueItem(item) {
  item.status = "processing";
  item.status_msg = "Lendo e extraindo texto (PDF)...";
  item.error = null;
  renderQueue();
  
  try {
    if (shouldStopProcessing) throw new Error("Cancelado pelo usuário");
    
    // 1. Carregar chave e prompts
    const config = await loadGeminiConfig();
    if (!config || !config.key) {
      throw new Error("Chave do Gemini não configurada no servidor");
    }

    if (shouldStopProcessing) throw new Error("Cancelado pelo usuário");

    // 2. Extrair Texto do arquivo via backend (rápido, <1s)
    const resExtract = await fetch(`/api/queue/extract/${encodeURIComponent(proj)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: item.safe_name })
    });
    const dataExtract = await resExtract.json();
    if (!dataExtract.ok) throw new Error(dataExtract.error || "Falha ao extrair texto");
    
    if (shouldStopProcessing) throw new Error("Cancelado pelo usuário");
    
    // 3. Processar com Gemini AI (Passo Único Inteligente)
    item.status_msg = "Processando com Gemini (Passo Único)...";
    renderQueue();
    
    // Detecção dinâmica de Quiz, Gabarito, Simulado ou Resumos
    const nameLower = (item.name || "").toLowerCase();
    const textLower = (dataExtract.text || "").toLowerCase().slice(0, 3000);
    
    let docTypeInstruction = "";
    
    const isQuiz = 
      nameLower.includes("quiz") || 
      nameLower.includes("gabarito") ||

      nameLower.includes("questo") ||

      nameLower.includes("teste") ||

      textLower.includes("questão 1") ||
      textLower.includes("questão 01") ||
      textLower.includes("alternativa correta") ||
      textLower.includes("resolução comentada");
      
    const isSummary =
      nameLower.includes("resumo") ||
      nameLower.includes("sumario") ||
      nameLower.includes("cronograma") ||
      nameLower.includes("guia") ||
      textLower.includes("resumo de") ||
      textLower.includes("cronograma");
      
    if (isQuiz) {
      console.log("ℹ️ Detectado tipo de arquivo: QUIZ / GABARITO / EXERCÍCIOS");
      docTypeInstruction = 
        "\n⚠️ INSTRUÇÃO CRÍTICA DE PRESERVAÇÃO DE QUIZ/GABARITO:\n" +
        "- O documento bruto fornecido é um QUIZ, SIMULADO, LISTA DE EXERCÍCIOS ou GABARITO.\n" +
        "- Você NÃO deve transformá-lo em uma aula teórica explicativa longa!\n" +
        "- Você DEVE PRESERVAR INTEGRALMENTE todas as questões, alternativas, gabaritos e respostas contidas no original.\n" +
        "- Não exclua nenhuma questão, não resuma a lista de exercícios e não alucine novos assuntos.\n" +
        "- Formate cada questão com um subtítulo como '### Questão X', seguido do enunciado, das alternativas em linhas separadas (a, b, c, d, e), o gabarito em negrito ('**Gabarito**: Alternativa X') e a resolução comentada explicativa ('**Resolução Comentada**: ...').\n" +
        "- Se o arquivo for apenas um Gabarito (tabela/lista de respostas), mantenha a correspondência exata das respostas e formate-o no padrão Evolux.\n" +
        "- Comece diretamente com '---' e configure o cabeçalho YAML para descrever o Quiz/Gabarito (ex: 'title: Simulado e Gabarito de Exercícios' ou 'title: Gabarito - Aulas 1 a 7').\n\n";
    } else if (isSummary) {
      console.log("ℹ️ Detectado tipo de arquivo: RESUMO / GUIA / CRONOGRAMA");
      docTypeInstruction = 
        "\n⚠️ INSTRUÇÃO CRÍTICA DE PRESERVAÇÃO DE RESUMO/GUIA:\n" +
        "- O documento bruto fornecido é um RESUMO, CRONOGRAMA ou GUIA DE ESTUDOS.\n" +
        "- Não tente expandir este documento artificialmente para 2000 palavras nem criar uma aula teórica longa.\n" +
        "- Preserve o formato conciso, objetivo e esquematizado do resumo original.\n" +
        "- Estruture com títulos e subtítulos claros, listas com traços e blocos '[BOX]' para conceitos fundamentais.\n" +
        "- Comece diretamente com '---' no cabeçalho YAML.\n\n";
    }
    
    const singlePassPrompt = `${config.base_prompt}\n\n` +
      "Você também atuará como o Revisor Editorial Sênior da Evolux Academy especializado em design instrucional e revisão ortográfica.\n" +
      "Sua missão é gerar o conteúdo em Markdown impecável, formatado e revisado de primeira, seguindo regras rígidas de saída:\n\n" +
      `${config.review_instructions}\n\n` +
      "INSTRUÇÃO DE GERAÇÃO:\n" +
      docTypeInstruction +
      "Reescreva e adapte o conteúdo bruto fornecido abaixo ao padrão especificado, aplicando diretamente todas as diretrizes de revisão e formatação em um único passo. " +
      "Importante: Sua resposta deve começar diretamente com '---' sem qualquer mensagem introdutória ou saudação.\n\n" +
      `CONTEÚDO BRUTO A SER PROCESSADO:\n${dataExtract.text}`;
      
    let finalMarkdown = await callGeminiDirect(singlePassPrompt);
    
    if (shouldStopProcessing) throw new Error("Cancelado pelo usuário");
    finalMarkdown = sanitizeMarkdown(finalMarkdown);
    
    // 4. Salvar no projeto e na nuvem
    item.status_msg = "Salvando e sincronizando na nuvem...";
    renderQueue();
    
    const resSave = await fetch(`/api/queue/save/${encodeURIComponent(proj)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        filename: item.safe_name,
        content: finalMarkdown
      })
    });
    const dataSave = await resSave.json();
    if (!dataSave.ok) throw new Error(dataSave.error || "Falha ao salvar no projeto");
    
    // Concluído com Sucesso!
    item.status = "completed";
    item.checked = false; // Desmarca ao concluir
    item.saved_as = dataSave.saved_as;
    toast(`✅ Processado: ${item.name}`, "success");
    
  } catch (err) {
    console.error(err);
    item.status = "failed";
    
    const errMsg = err.message || String(err);
    item.error = errMsg;
    
    if (errMsg !== "Cancelado pelo usuário") {
      toast(`❌ Falha: ${item.name}`, "error");
      
      const lowerMsg = errMsg.toLowerCase();
      const isQuotaError = lowerMsg.includes("quota") || 
                           lowerMsg.includes("resource_exhausted") || 
                           lowerMsg.includes("resourceexhausted") ||
                           lowerMsg.includes("rate limit") || 
                           lowerMsg.includes("429");
                           
      if (isQuotaError) {
        shouldStopProcessing = true;
        alert("⚠️ Limite da API do Gemini Atingido!\n\nO processamento da fila foi pausado automaticamente para poupar sua cota e evitar falhas consecutivas. Por favor, aguarde alguns instantes antes de processar novamente.");
      }
    } else {
      toast(`🛑 Cancelado: ${item.name}`, "warning");
    }
  }
  
  renderQueue();
  _mdSig = "";
  loadFiles(true);
}

async function processQueue() {
  if (isProcessingQueue || uploadQueue.length === 0) return;
  
  const targets = uploadQueue.filter(item => item.checked && (item.status === "pending" || item.status === "failed"));
  if (targets.length === 0) {
    toast("Selecione pelo menos um arquivo pendente para processar", "error");
    return;
  }
  
  isProcessingQueue = true;
  shouldStopProcessing = false;
  
  const btn = document.getElementById("btnProcessQueue");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinning">⏳</span> Processando...';
  
  const btnStop = document.getElementById("btnStopQueue");
  if (btnStop) {
    btnStop.style.display = "inline-flex";
    btnStop.disabled = false;
    btnStop.innerHTML = "🛑 Parar";
  }
  
  for (let i = 0; i < uploadQueue.length; i++) {
    if (shouldStopProcessing) {
      toast("🛑 Processamento interrompido pelo usuário", "warning");
      break;
    }
    const item = uploadQueue[i];
    if (item.checked && (item.status === "pending" || item.status === "failed")) {
      await processQueueItem(item);
    }
  }
  
  isProcessingQueue = false;
  btn.disabled = false;
  btn.textContent = "▶ Processar Selecionados";
  if (btnStop) btnStop.style.display = "none";
}

async function reprocessQueueItem(idx) {
  if (isProcessingQueue) return;
  shouldStopProcessing = false;
  const item = uploadQueue[idx];
  await processQueueItem(item);
}
