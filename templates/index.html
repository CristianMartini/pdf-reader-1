<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Engine — Evolux Academy</title>
<style>
:root{--navy:#011641;--gold:#e2a331;--bg:#f4f6fb;--card:#fff;--text:#1a2340;--muted:#6b7a99;--border:#dde3f0;--green:#22c55e;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--navy);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.18);}
.brand{color:var(--gold);font-size:1.1rem;font-weight:700;letter-spacing:.5px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Layout */
.app{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 60px);}
@media(max-width:900px){.app{grid-template-columns:1fr;}}

/* Sidebar projetos */
.sidebar{background:#fff;border-right:1px solid var(--border);padding:1.2rem;display:flex;flex-direction:column;gap:1rem;}
.sidebar h3{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.project-item{padding:10px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center;}
.project-item:hover{border-color:var(--gold);}
.project-item.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.project-item.active .proj-meta{color:#afc6ff;}
.proj-name{font-weight:600;font-size:.9rem;}
.proj-meta{font-size:.75rem;color:var(--muted);}
.proj-del{background:none;border:none;cursor:pointer;color:inherit;opacity:.5;padding:2px 6px;border-radius:4px;}
.proj-del:hover{opacity:1;color:var(--red);}

/* Main */
.main{padding:1.5rem;display:grid;grid-template-columns:1fr 1.4fr;gap:1.2rem;align-content:start;}
@media(max-width:1100px){.main{grid-template-columns:1fr;}}
.full{grid-column:1/-1;}

/* Card */
.card{background:#fff;border-radius:14px;padding:1.3rem;box-shadow:0 2px 16px rgba(1,22,65,.07);border:1px solid var(--border);}
.card-title{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center;gap:8px;}

/* Files */
.file-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.file-item,.img-item,.pdf-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#fafbff;transition:border-color .15s;font-size:.85rem;}
.file-item:hover,.img-item:hover,.pdf-item:hover{border-color:var(--gold);}
.file-item.active{border-color:var(--navy);background:#eef3ff;}
.f-name{flex:1;font-weight:500;word-break:break-all;}
.pdf-item{background:linear-gradient(135deg,#f9fbff,#eef3ff);border-left:3px solid var(--gold);}

/* Editor */
.toolbar{display:flex;gap:6px;flex-wrap:wrap;background:#f8fafc;padding:7px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;}
textarea{width:100%;min-height:380px;padding:12px;border:1px solid var(--border);border-radius:8px;font-family:"Courier New",monospace;font-size:13px;resize:vertical;line-height:1.6;}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;}

/* Btns */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:8px;font-size:.83rem;font-weight:600;border:none;cursor:pointer;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--navy);color:#fff;}.btn-primary:hover{background:#02245e;}
.btn-gold{background:var(--gold);color:var(--navy);}.btn-gold:hover{background:#d09428;}
.btn-sm{padding:4px 10px;font-size:.78rem;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--navy);color:var(--navy);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}.btn-danger:hover{background:var(--red);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Log */
.log{background:var(--navy);border-radius:8px;padding:.8rem;font-family:monospace;font-size:.78rem;color:#afc6ff;max-height:160px;overflow-y:auto;white-space:pre-wrap;display:none;margin-top:.8rem;}
.log.on{display:block;}.log .ok{color:var(--green);}.log .err{color:var(--red);}

/* Toast */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--navy);color:#fff;padding:.7rem 1.2rem;border-radius:10px;transform:translateY(100px);opacity:0;transition:all .3s;z-index:999;font-size:.88rem;}
#toast.show{transform:translateY(0);opacity:1;}
#toast.success{border-left:4px solid var(--green);}
#toast.error{border-left:4px solid var(--red);}

/* Empty state */
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);}
.empty h2{margin-bottom:.5rem;color:var(--navy);}
.muted{color:var(--muted);font-size:.82rem;}

/* New project input */
.new-proj{display:flex;gap:6px;}
.new-proj input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;}

.spinning{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Estilos de Miniatura de Imagem com Hover Premium */
.img-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
}
.img-item:hover {
  border-color: var(--navy);
  box-shadow: 0 2px 6px rgba(1, 22, 65, 0.08);
}
.img-thumb-container {
  width: 44px;
  height: 44px;
  border-radius: 6px;
  overflow: visible; /* Permite que o preview saia do container */
  border: 1px solid var(--border);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
}
.img-thumb-inner {
  width: 100%;
  height: 100%;
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.img-thumb-inner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.2s;
}
.img-thumb-container:hover .img-thumb-inner img {
  transform: scale(1.1);
}
.img-preview-hover {
  position: absolute;
  bottom: 52px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  height: 220px;
  background: #fff;
  border: 2px solid var(--navy);
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(1, 22, 65, 0.2);
  z-index: 100;
  display: none;
  pointer-events: none;
  overflow: hidden;
  animation: previewFadeIn 0.15s ease-out;
}
.img-preview-hover::after {
  content: "";
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 10px 10px 0;
  border-style: solid;
  border-color: var(--navy) transparent;
  display: block;
  width: 0;
}
.img-preview-hover img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #f1f5f9;
}
.img-thumb-container:hover .img-preview-hover {
  display: block;
}
@keyframes previewFadeIn {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
</style>
</head>
<body>

<header>
  <span class="brand">⚡ PDF Engine • Evolux Academy</span>
  <div style="display:flex;align-items:center;gap:16px;">
    <a href="/api/instrucoes-ia" class="btn btn-ghost btn-sm" style="color:#afc6ff; border-color:rgba(175,198,255,0.3); font-weight:normal;" title="Baixe o manual de formatação para alimentar IAs">🤖 Instruções IA</a>
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="dot"></div>
      <span style="color:#afc6ff;font-size:.8rem;">live</span>
    </div>
  </div>
</header>

<div class="app">

  <!-- ══ SIDEBAR PROJETOS ══ -->
  <aside class="sidebar">
    <div>
      <h3 style="margin-bottom:.6rem;">📁 Projetos</h3>
      <div class="new-proj">
        <input id="newProjName" placeholder="Nome do projeto..." onkeydown="if(event.key==='Enter')createProject()">
        <button class="btn btn-gold btn-sm" onclick="createProject()">＋</button>
      </div>
    </div>
    <div id="projectList" style="display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;"></div>
  </aside>

  <!-- ══ MAIN ══ -->
  <div class="main" id="mainArea">
    <div class="empty full">
      <h2>Selecione ou crie um projeto</h2>
      <p>Cada projeto tem seus próprios documentos, imagens e PDFs.</p>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
let proj = null;   // projeto ativo
let file = null;   // arquivo ativo
let _mdSig = "", _pdfSig = "";
let _toastT = null;
let uploadQueue = []; // Fila de uploads para IA
let isProcessingQueue = false;

// ══ PROJETOS ══
async function loadProjects() {
  const r = await fetch("/api/projects");
  const d = await r.json();
  const el = document.getElementById("projectList");
  el.innerHTML = d.projects.map(p => `
    <div class="project-item ${p.name===proj?'active':''}" onclick="selectProject('${p.name}')">
      <div>
        <div class="proj-name">📂 ${p.name}</div>
        <div class="proj-meta">${p.mds} doc${p.mds!==1?'s':''} • ${p.pdfs} PDF${p.pdfs!==1?'s':''}</div>
      </div>
      <button class="proj-del" onclick="event.stopPropagation();deleteProject('${p.name}')" title="Excluir projeto">🗑</button>
    </div>
  `).join("") || '<p class="muted">Nenhum projeto ainda.</p>';
}

async function createProject() {
  const inp = document.getElementById("newProjName");
  const name = inp.value.trim();
  if (!name) return;
  const r = await fetch("/api/projects", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name})
  });
  const d = await r.json();
  if (d.ok) { inp.value=""; await loadProjects(); selectProject(d.name); }
  else toast("❌ " + d.error, "error");
}

async function deleteProject(name) {
  if (!confirm(`Excluir projeto "${name}" e todos os seus arquivos?`)) return;
  await fetch(`/api/projects/${encodeURIComponent(name)}`, {method:"DELETE"});
  if (proj === name) { proj=null; file=null; renderEmpty(); }
  loadProjects();
  toast("🗑 Projeto removido");
}

function renderEmpty() {
  document.getElementById("mainArea").innerHTML = `
    <div class="empty full"><h2>Selecione ou crie um projeto</h2>
    <p>Cada projeto tem seus próprios documentos, imagens e PDFs.</p></div>`;
}

// ══ SELECIONAR PROJETO ══
function selectProject(name) {
  proj = name; file = null; _mdSig = ""; _pdfSig = "";
  uploadQueue = []; // Limpa fila ao trocar de projeto
  isProcessingQueue = false;
  loadProjects();
  renderMain();
}

function renderMain() {
  document.getElementById("mainArea").innerHTML = `
    <!-- COLUNA DA ESQUERDA: FLUXO DE ARQUIVOS (PASSO 1, 2 E 3) -->
    <div style="display: flex; flex-direction: column; gap: 1.2rem;">
      
      <!-- CARD PASSO 1: IMPORTADOR EM LOTE COM IA -->
      <div class="card">
        <div class="card-title">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700;">Passo 1</span>
            <span>🤖 Importar Aulas (Lote/IA)</span>
          </div>
        </div>
        <p class="muted" style="margin-bottom:.8rem; line-height: 1.4;">
          Suba múltiplos arquivos <b>.pdf</b> ou <b>.md</b> antigos. A IA extrairá o texto e reescreverá no padrão Evolux.
        </p>
        
        <div style="border: 2px dashed var(--border); padding: 1.2rem; text-align: center; border-radius: 8px; cursor: pointer; transition: border-color .15s;" 
             id="dropZone"
             onclick="document.getElementById('queueUp').click()"
             onmouseover="this.style.borderColor='var(--gold)'"
             onmouseout="this.style.borderColor='var(--border)'">
          <span style="font-size: 1.5rem; display: block; margin-bottom: 4px;">📤</span>
          <span style="font-size: .85rem; font-weight: 600; color: var(--navy);">Selecionar arquivos .pdf ou .md</span>
          <input type="file" id="queueUp" accept=".md,.pdf" multiple style="display:none" onchange="addFilesToQueue(this)">
        </div>
        
        <div id="queueSection" style="display:none; margin-top: 1rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem;">
            <div style="display:flex; align-items:center; gap:6px;">
              <input type="checkbox" id="queueCheckAll" checked style="cursor:pointer; width:16px; height:16px;" onchange="toggleSelectAllQueue(this.checked)">
              <span style="font-size:.82rem; font-weight:700; color:var(--navy);">Fila (<span id="queueCount">0</span>)</span>
            </div>
            <button class="btn btn-gold btn-sm" id="btnProcessQueue" onclick="processQueue()">▶ Processar Selecionados</button>
          </div>
          <div class="file-list" id="queueList" style="max-height: 200px;"></div>
        </div>
      </div>

      <!-- CARD PASSO 2: DOCUMENTOS -->
      <div class="card">
        <div class="card-title" style="justify-content: space-between; align-items: center; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700;">Passo 2</span>
            <span>📄 Selecionar Documento</span>
          </div>
          <div>
            <button class="btn btn-primary btn-sm" onclick="document.getElementById('mdUp').click()">＋ Upload .md</button>
            <input type="file" id="mdUp" accept=".md" style="display:none" onchange="uploadFile(this,'md')">
          </div>
        </div>
        <p class="muted" style="margin-bottom:.6rem;">Selecione um arquivo Markdown abaixo para carregar no editor.</p>
        <div class="file-list" id="mdList" style="max-height: 180px;"></div>
      </div>

      <!-- CARD PASSO 3: IMAGENS -->
      <div class="card">
        <div class="card-title" style="justify-content: space-between; align-items: center; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700;">Passo 3</span>
            <span>🖼️ Inserir Imagens</span>
          </div>
          <div>
            <button class="btn btn-gold btn-sm" onclick="document.getElementById('imgUp').click()">＋ Upload</button>
            <button class="btn btn-danger btn-sm" onclick="clearImages()" style="margin-left:4px;">🗑 Limpar</button>
            <input type="file" id="imgUp" accept="image/*" multiple style="display:none" onchange="uploadFile(this,'img')">
          </div>
        </div>
        <p class="muted" style="margin-bottom:.6rem;">Clique para inserir no cursor do editor ou selecione caixas para agrupar.</p>
        <div class="file-list" id="imgList" style="max-height: 180px;"></div>
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
          <button class="btn btn-gold btn-sm" onclick="insertSelectedImages()" style="width: 100%; justify-content: center;">▶ Inserir Selecionadas Juntas</button>
        </div>
      </div>

    </div>

    <!-- COLUNA DA DIREITA: EDITOR E CRIAÇÃO (PASSO 4) -->
    <div class="card" style="display: flex; flex-direction: column; gap: 0.8rem; height: 100%;">
      <div class="card-title" style="justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 0;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700;">Passo 4</span>
          <span>✍️ Editor de Conteúdo</span>
        </div>
        <span id="fileName" style="font-size:.82rem;color:var(--muted);font-weight:normal;">Nenhum arquivo</span>
      </div>
      
      <div class="toolbar">
        <button class="btn btn-ghost btn-sm" onclick="ins('# ')">H1</button>
        <button class="btn btn-ghost btn-sm" onclick="ins('## ')">H2</button>
        <button class="btn btn-ghost btn-sm" onclick="ins('### ')">H3</button>
        <button class="btn btn-ghost btn-sm" onclick="ins('- ')">Lista</button>
        <button class="btn btn-ghost btn-sm" onclick="insBox()">Box</button>
        <button class="btn btn-ghost btn-sm" onclick="insImg('nome.jpg')">1 Imagem</button>
        <button class="btn btn-ghost btn-sm" onclick="insImg('img1.jpg|img2.jpg')">2 Imagens</button>
        <button class="btn btn-ghost btn-sm" onclick="insDivider()">Divisor</button>
      </div>
      
      <textarea id="ed" style="flex: 1; min-height: 520px;" placeholder="Selecione um arquivo ou comece a escrever...&#10;&#10;Use front-matter:&#10;---&#10;title: Título da Aula&#10;aula: 01&#10;---"></textarea>
      
      <div class="actions">
        <button class="btn btn-primary" onclick="saveFile()">💾 Salvar</button>
        <button class="btn btn-gold" id="btnGen" onclick="generatePDF()">▶ Gerar PDF</button>
        <button class="btn btn-danger" id="btnDel" onclick="deleteCurrentFile()" style="display:none;margin-left:auto;">🗑 Excluir</button>
      </div>
      
      <div class="log" id="log"></div>
    </div>

    <!-- SEÇÃO INFERIOR: PDFs GERADOS (PASSO 5) -->
    <div class="card full">
      <div class="card-title">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--gold); font-weight: 700;">Passo 5</span>
          <span>📑 PDFs Gerados (Padrão Evolux)</span>
        </div>
        <span id="pdfCount" style="font-size:.8rem;color:var(--muted);font-weight:normal;"></span>
      </div>
      <div id="pdfList" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
    </div>
  `;
  loadFiles();
}

// ══ ARQUIVOS ══
async function loadFiles(silent=false) {
  if (!proj) return;
  const r = await fetch(`/api/files/${encodeURIComponent(proj)}`);
  const d = await r.json();

  const mdSig = JSON.stringify(d.mds);
  if (mdSig !== _mdSig) {
    _mdSig = mdSig;
    document.getElementById("mdList").innerHTML = d.mds.map(f => `
      <div class="file-item ${f===file?'active':''}" style="cursor:pointer" onclick="loadFile('${f}')">
        <span class="f-name">📄 ${f}</span>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();delFile('md','${f}')">🗑</button>
      </div>`).join("") || '<p class="muted">Nenhum documento</p>';
  }

  document.getElementById("imgList").innerHTML = d.imgs.map(f => {
    const url = `/projects/${encodeURIComponent(proj)}/assets/${encodeURIComponent(f)}`;
    const fallbackSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'/><circle cx='8.5' cy='8.5' r='1.5'/><polyline points='21 15 16 10 5 21'/></svg>";
    return `
      <div class="img-item">
        <input type="checkbox" class="img-check" value="${f}" style="cursor:pointer; width:16px; height:16px; flex-shrink:0;">
        <div class="img-thumb-container" onclick="insImg('${f}')" title="Passe o mouse para ampliar. Clique para inserir.">
          <div class="img-thumb-inner">
            <img src="${url}" onerror="this.src=\`${fallbackSvg}\`"/>
          </div>
          <div class="img-preview-hover">
            <img src="${url}" onerror="this.src=\`${fallbackSvg}\`"/>
          </div>
        </div>
        <span class="f-name" style="cursor:pointer; flex:1; word-break:break-all; font-size:.82rem; font-weight:500;" onclick="insImg('${f}')" title="Inserir no editor">${f}</span>
        <button class="btn btn-ghost btn-sm" style="flex-shrink:0; padding:2px 6px;" onclick="delFile('img','${f}')">🗑</button>
      </div>
    `;
  }).join("") || '<p class="muted">Nenhuma imagem</p>';

  const pdfSig = JSON.stringify(d.pdfs);
  if (pdfSig !== _pdfSig) {
    _pdfSig = pdfSig;
    document.getElementById("pdfList").innerHTML = d.pdfs.map(f => `
      <div class="pdf-item" style="width:min(100%,360px)">
        <span class="f-name">📑 ${f}</span>
        <a href="/projects/${encodeURIComponent(proj)}/pdf/${encodeURIComponent(f)}" target="_blank" class="btn btn-primary btn-sm">Abrir</a>
        <a href="/projects/${encodeURIComponent(proj)}/pdf/${encodeURIComponent(f)}" download class="btn btn-gold btn-sm">Baixar</a>
        <button class="btn btn-danger btn-sm" onclick="delFile('pdf','${f}')">🗑</button>
      </div>`).join("") || '<p class="muted">Nenhum PDF gerado</p>';
    const c = d.pdfs.length;
    const el = document.getElementById("pdfCount");
    if (el) el.textContent = c ? `${c} arquivo${c>1?'s':''}` : "";
  }
}

async function loadFile(filename) {
  const r = await fetch(`/api/file/${encodeURIComponent(proj)}/${encodeURIComponent(filename)}`);
  const d = await r.json();
  if (!d.ok) return;
  document.getElementById("ed").value = d.content;
  document.getElementById("fileName").textContent = filename;
  document.getElementById("btnDel").style.display = "block";
  document.getElementById("log").classList.remove("on");
  file = filename;
  _mdSig = ""; loadFiles(true);
}

async function saveFile() {
  if (!proj) return;
  if (!file) {
    const n = prompt("Nome do arquivo (ex: aula01.md):");
    if (!n) return;
    file = n.endsWith(".md") ? n : n + ".md";
    document.getElementById("fileName").textContent = file;
    document.getElementById("btnDel").style.display = "block";
  }
  const content = document.getElementById("ed").value;
  const r = await fetch(`/api/save/${encodeURIComponent(proj)}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({filename: file, content})
  });
  if (r.ok) { toast("💾 Salvo","success"); _mdSig=""; loadFiles(true); }
}

async function deleteCurrentFile() {
  if (!file || !confirm(`Excluir ${file}?`)) return;
  await delFile('md', file);
  file = null;
  document.getElementById("fileName").textContent = "Nenhum arquivo";
  document.getElementById("ed").value = "";
  document.getElementById("btnDel").style.display = "none";
}

async function delFile(kind, filename) {
  await fetch(`/api/delete/${encodeURIComponent(proj)}/${kind}/${encodeURIComponent(filename)}`, {method:"DELETE"});
  _mdSig = _pdfSig = "";
  loadFiles(true);
  loadProjects();
  toast("🗑 Removido");
}

async function clearImages() {
  if (!proj) return;
  if (!confirm('Excluir TODAS as imagens deste projeto?')) return;
  const r = await fetch(`/api/clear-images/${encodeURIComponent(proj)}`, {method:"DELETE"});
  const d = await r.json();
  if (d.ok) {
    toast("🗑 Todas as imagens removidas");
    _mdSig = _pdfSig = "";
    loadFiles(true);
  } else {
    toast("❌ Erro ao limpar imagens", "error");
  }
}

async function uploadFile(input, kind) {
  if (!input.files.length || !proj) return;
  const fd = new FormData();
  for (let i=0;i<input.files.length;i++) fd.append("files", input.files[i]);
  const r = await fetch(`/api/upload/${encodeURIComponent(proj)}/${kind}`, {method:"POST",body:fd});
  const d = await r.json();
  if (d.ok) {
    toast(`✅ ${d.saved} arquivo(s) enviado(s)`,"success");
    _mdSig=""; loadFiles(true); loadProjects();
    if (kind==='md' && input.files.length===1) loadFile(input.files[0].name);
  }
  input.value="";
}

// ══ GERAR PDF ══
async function generatePDF() {
  if (!proj) return;
  if (!file) { toast("Selecione um arquivo primeiro","error"); return; }
  await saveFile();
  const btn = document.getElementById("btnGen");
  btn.innerHTML = '<span class="spinning">⏳</span> Gerando...';
  btn.disabled = true;
  const log = document.getElementById("log");
  log.innerHTML = "⏳ Gerando PDF..."; log.classList.add("on");
  const r = await fetch("/api/generate", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({project: proj, files:[file]})
  });
  const d = await r.json();
  btn.innerHTML = "▶ Gerar PDF"; btn.disabled = false;
  if (d.ok && d.result?.length) {
    log.innerHTML += `\n<span class="ok">✅ ${d.result[0]} gerado!</span>`;
    toast("✅ PDF gerado!","success");
    _pdfSig=""; loadFiles(); loadProjects();
  } else {
    log.innerHTML += `\n<span class="err">❌ ${d.error||'Erro ao gerar'}</span>`;
    toast("❌ Falha ao gerar","error");
  }
}

// ══ INSERÇÕES ══
function ins(text) {
  const t = document.getElementById("ed");
  const s = t.selectionStart, e = t.selectionEnd;
  t.value = t.value.substring(0,s) + text + t.value.substring(e);
  t.selectionStart = t.selectionEnd = s + text.length;
  t.focus();
}
function insImg(f) {
  const t = document.getElementById("ed");
  const s = t.selectionStart, e = t.selectionEnd;
  const selText = t.value.substring(s, e);
  
  if (s !== e && /\[IMG:[^\]]+\]/.test(selText)) {
    const newText = selText.replace(/\[IMG:[^\]]+\]/, `[IMG:${f}]`);
    t.value = t.value.substring(0, s) + newText + t.value.substring(e);
    t.selectionStart = s;
    t.selectionEnd = s + newText.length;
    t.focus();
    toast("🖼️ Imagem substituída na tag mantendo a legenda", "success");
  } else {
    ins('\n[IMG:' + f + ']\n');
  }
}
function insertSelectedImages() {
  const checks = document.querySelectorAll('.img-check:checked');
  if (checks.length === 0) {
    toast("Selecione pelo menos uma imagem nas caixinhas", "error");
    return;
  }
  const names = Array.from(checks).map(c => c.value).join('|');
  
  const t = document.getElementById("ed");
  const s = t.selectionStart, e = t.selectionEnd;
  const selText = t.value.substring(s, e);
  
  if (s !== e && /\[IMG:[^\]]+\]/.test(selText)) {
    const newText = selText.replace(/\[IMG:[^\]]+\]/, `[IMG:${names}]`);
    t.value = t.value.substring(0, s) + newText + t.value.substring(e);
    t.selectionStart = s;
    t.selectionEnd = s + newText.length;
    t.focus();
    toast("🖼️ Imagens substituídas na tag mantendo a legenda", "success");
  } else {
    ins('\n[IMG:' + names + ']\n');
  }
  
  // Desmarcar depois de inserir
  checks.forEach(c => c.checked = false);
}
function insDivider() { ins('\n---\n'); }
function insBox() {
  const t = document.getElementById("ed");
  const s = t.selectionStart, e = t.selectionEnd;
  const sel = t.value.substring(s,e).trim() || "Texto importante aqui.";
  const txt = `\n[BOX]\n${sel}\n[/BOX]\n`;
  t.value = t.value.substring(0,s) + txt + t.value.substring(e);
  t.selectionStart = t.selectionEnd = s + txt.length;
  t.focus();
}

// ══ TOAST ══
function toast(msg, type="success") {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = `show ${type}`;
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.className="", 3000);
}

// ══ FILA DE PROCESSAMENTO COM IA ══
async function addFilesToQueue(input) {
  if (!input.files.length || !proj) return;
  
  const fd = new FormData();
  for (let i = 0; i < input.files.length; i++) {
    fd.append("files", input.files[i]);
  }
  
  toast("Enviando arquivos para a fila...", "success");
  
  try {
    const r = await fetch(`/api/queue/upload/${encodeURIComponent(proj)}`, {
      method: "POST",
      body: fd
    });
    const d = await r.json();
    
    if (d.ok) {
      d.files.forEach(f => {
        uploadQueue.push({
          name: f.name,
          safe_name: f.safe_name,
          type: f.type,
          status: "pending",
          error: null,
          saved_as: null,
          checked: true
        });
      });
      toast(`✅ ${d.files.length} arquivos na fila`, "success");
      renderQueue();
    } else {
      toast("❌ Erro ao adicionar arquivos: " + d.error, "error");
    }
  } catch (err) {
    toast("❌ Falha de rede no upload", "error");
  }
  
  input.value = "";
}

function renderQueue() {
  const sec = document.getElementById("queueSection");
  const list = document.getElementById("queueList");
  const count = document.getElementById("queueCount");
  
  if (!sec || !list || !count) return;
  
  if (uploadQueue.length === 0) {
    sec.style.display = "none";
    return;
  }
  
  sec.style.display = "block";
  count.textContent = uploadQueue.length;
  
  list.innerHTML = uploadQueue.map((item, idx) => {
    let statusBadge = "";
    let btnOpen = "";
    let btnReprocess = "";
    let checkbox = "";
    
    if (item.status === "pending" || item.status === "failed") {
      checkbox = `<input type="checkbox" class="queue-check" ${item.checked ? 'checked' : ''} style="cursor:pointer; width:16px; height:16px;" onchange="toggleQueueItemChecked(${idx}, this.checked)" ${isProcessingQueue ? 'disabled' : ''}>`;
    } else {
      checkbox = `<div style="width:16px; height:16px;"></div>`;
    }
    
    if (item.status === "pending") {
      statusBadge = `<span style="font-size:.75rem; font-weight:600; padding:2px 6px; border-radius:4px; background:#dde3f0; color:var(--text);">Pendente</span>`;
    } else if (item.status === "processing") {
      statusBadge = `<span style="font-size:.75rem; font-weight:600; padding:2px 6px; border-radius:4px; background:#f9d549; color:var(--navy);"><span class="spinning">⏳</span> ${item.status_msg || 'Processando...'}</span>`;
    } else if (item.status === "completed") {
      statusBadge = `<span style="font-size:.75rem; font-weight:600; padding:2px 6px; border-radius:4px; background:#dcfce7; color:#15803d;">Pronto</span>`;
      btnOpen = `<button class="btn btn-primary btn-sm" style="padding:2px 6px; font-size:.75rem;" onclick="loadFile('${item.saved_as}')">Editar</button>`;
      btnReprocess = `<button class="btn btn-ghost btn-sm" style="padding:2px 6px; color:var(--gold); border-color:var(--gold);" onclick="reprocessQueueItem(${idx})" title="Reprocessar arquivo individual" ${isProcessingQueue ? 'disabled' : ''}>🔄</button>`;
    } else if (item.status === "failed") {
      statusBadge = `<span style="font-size:.75rem; font-weight:600; padding:2px 6px; border-radius:4px; background:#fee2e2; color:#b91c1c;" title="${item.error || 'Erro desconhecido'}">Falha</span>`;
      btnReprocess = `<button class="btn btn-ghost btn-sm" style="padding:2px 6px; color:var(--gold); border-color:var(--gold);" onclick="reprocessQueueItem(${idx})" title="Reprocessar arquivo individual" ${isProcessingQueue ? 'disabled' : ''}>🔄</button>`;
    }
    
    return `
      <div class="file-item" style="justify-content:space-between; gap:10px; align-items:center;">
        <div style="display:flex; align-items:center; gap:8px; flex:1;">
          ${checkbox}
          <div style="display:flex; flex-direction:column; gap:2px; flex:1;">
            <span style="font-weight:600; word-break:break-all;">${item.type === 'pdf' ? '📑' : '📄'} ${item.name}</span>
            ${item.error ? `<span style="font-size:.72rem; color:var(--red); font-weight:normal;">${item.error}</span>` : ""}
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          ${statusBadge}
          ${btnOpen}
          ${btnReprocess}
          <button class="btn btn-ghost btn-sm" style="padding:2px 6px;" onclick="removeFromQueue(${idx})" ${isProcessingQueue ? 'disabled' : ''}>🗑</button>
        </div>
      </div>
    `;
  }).join("");
}

function toggleQueueItemChecked(idx, checked) {
  uploadQueue[idx].checked = checked;
  if (!checked) {
    const el = document.getElementById("queueCheckAll");
    if (el) el.checked = false;
  }
}

function toggleSelectAllQueue(checked) {
  uploadQueue.forEach(item => {
    if (item.status === "pending" || item.status === "failed") {
      item.checked = checked;
    }
  });
  renderQueue();
}

function removeFromQueue(idx) {
  if (isProcessingQueue) return;
  uploadQueue.splice(idx, 1);
  renderQueue();
}

async function processQueue() {
  if (isProcessingQueue || uploadQueue.length === 0) return;
  
  const targets = uploadQueue.filter(item => item.checked && (item.status === "pending" || item.status === "failed"));
  if (targets.length === 0) {
    toast("Selecione pelo menos um arquivo pendente para processar", "error");
    return;
  }
  
  isProcessingQueue = true;
  const btn = document.getElementById("btnProcessQueue");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinning">⏳</span> Processando...';
  
  for (let i = 0; i < uploadQueue.length; i++) {
    const item = uploadQueue[i];
    if (item.checked && (item.status === "pending" || item.status === "failed")) {
      item.status = "processing";
      item.status_msg = "Lendo arquivo...";
      item.error = null;
      renderQueue();
      
      let elapsed = 0;
      let progressInterval = setInterval(() => {
        elapsed += 1;
        if (elapsed === 2) {
          item.status_msg = "Buscando novos conteúdos...";
        } else if (elapsed === 8) {
          item.status_msg = "Revisando texto (Agente Revisor)...";
        } else if (elapsed === 14) {
          item.status_msg = "Salvando na nuvem...";
        } else if (elapsed === 18) {
          item.status_msg = "Quase pronto (90%)...";
        }
        renderQueue();
      }, 1000);
      
      try {
        const r = await fetch(`/api/queue/process/${encodeURIComponent(proj)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: item.safe_name })
        });
        const d = await r.json();
        
        clearInterval(progressInterval);
        
        if (d.ok) {
          item.status = "completed";
          item.checked = false; // Desmarca ao concluir
          item.saved_as = d.saved_as;
          toast(`✅ Processado: ${item.name}`, "success");
        } else {
          item.status = "failed";
          item.error = d.error || "Erro desconhecido";
          toast(`❌ Falha: ${item.name}`, "error");
        }
      } catch (err) {
        clearInterval(progressInterval);
        item.status = "failed";
        item.error = "Falha de conexão";
        toast(`❌ Erro de rede: ${item.name}`, "error");
      }
      
      renderQueue();
      _mdSig = "";
      loadFiles(true);
    }
  }
  
  isProcessingQueue = false;
  btn.disabled = false;
  btn.textContent = "▶ Processar Selecionados";
}

async function reprocessQueueItem(idx) {
  if (isProcessingQueue) return;
  
  const item = uploadQueue[idx];
  item.status = "processing";
  item.status_msg = "Lendo arquivo...";
  item.error = null;
  renderQueue();
  
  let elapsed = 0;
  let progressInterval = setInterval(() => {
    elapsed += 1;
    if (elapsed === 2) {
      item.status_msg = "Buscando novos conteúdos...";
    } else if (elapsed === 8) {
      item.status_msg = "Revisando texto (Agente Revisor)...";
    } else if (elapsed === 14) {
      item.status_msg = "Salvando na nuvem...";
    } else if (elapsed === 18) {
      item.status_msg = "Quase pronto (90%)...";
    }
    renderQueue();
  }, 1000);
  
  try {
    const r = await fetch(`/api/queue/process/${encodeURIComponent(proj)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: item.safe_name })
    });
    const d = await r.json();
    
    clearInterval(progressInterval);
    
    if (d.ok) {
      item.status = "completed";
      item.saved_as = d.saved_as;
      toast(`✅ Processado: ${item.name}`, "success");
    } else {
      item.status = "failed";
      item.error = d.error || "Erro desconhecido";
      toast(`❌ Falha: ${item.name}`, "error");
    }
  } catch (err) {
    clearInterval(progressInterval);
    item.status = "failed";
    item.error = "Falha de conexão";
    toast(`❌ Erro de rede: ${item.name}`, "error");
  }
  
  renderQueue();
  _mdSig = "";
  loadFiles(true);
}

// ══ AUTO-REFRESH ══
setInterval(() => { if (proj) loadFiles(true); loadProjects(); }, 5000);

loadProjects();
</script>
